services:
  - type: web
    name: librarian-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        value: https://allisonrvargas.github.io